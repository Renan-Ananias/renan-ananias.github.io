<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RENAN — Portfolio de Web Designer & Desenvolvedor Criativo. Design, UI/UX e Desenvolvimento." />
  <meta name="author" content="Renan Ananias" />
  <meta name="theme-color" content="#0a0e27" />

  <title>RENAN — Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- ============================================================ -->
  <!-- Dependências via CDN (sem build!)                              -->
  <!-- ============================================================ -->

  <!-- Tailwind CSS v3 (CDN oficial) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 (produção) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone — compila JSX direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ============================================================ -->
  <!-- Configuração do Tailwind (tema neon cyber)                      -->
  <!-- ============================================================ -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'neon-green': '#00ff88',
            'neon-cyan': '#00d9ff',
            'neon-magenta': '#ff00ff',
            'bg-dark': '#0a0e27',
            'bg-card': '#1a1f3a',
            'bg-border': '#2d3a5c',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Estilos customizados (animações + tema) -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- ============================================================ -->
  <!-- Google Analytics (invisível — não perturba o usuário)          -->
  <!-- ============================================================ -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N0YK98PT64"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N0YK98PT64');
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6286735969826499"
     crossorigin="anonymous"></script>
</head>

<body class="bg-[#0a0e27] text-gray-100">
  <!-- Ponto de montagem do React -->
  <div id="root"></div>

  <!-- Fallback enquanto React carrega -->
  <noscript>
    <div style="padding: 2rem; text-align: center; color: #00ff88;">
      ⚠️ Este site precisa de JavaScript habilitado para funcionar.
    </div>
  </noscript>

  <!--
    ============================================================
    Ponto de entrada da aplicação
    - type="text/babel"   : Babel compila o JSX
    - data-presets="react": suporta JSX
    - SEM data-type="module" (Babel Standalone tem bug com imports relativos)
    - Carrega bundle.js (gerado por concatenar.py) com TUDO concatenado
    ============================================================
  -->
  <script type="text/babel" data-presets="react" src="js/bundle.js"></script>
</body>
</html>
